[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "segqu"
version = "0.1.0"
description = "Official implementation of EMNLP 2026 Industry Track SEGQU"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate==1.9.0",
  "datasets==4.5.0",
  "polars==1.36.1",
  "scikit-learn==1.7.2",
  "sentencepiece==0.2.1",
  "torch==2.8.0",
  "transformers==4.57.6",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "ruff==0.15.10",
]

[project.scripts]
segqu-preprocess = "segqu.preprocess:main"
segqu-train = "segqu.train:main"
segqu-esci-preprocess = "segqu.esci.preprocess:main"
segqu-esci-train = "segqu.esci.train:main"
segqu-esci-evaluate = "segqu.esci.evaluate:main"

[tool.setuptools.packages.find]
include = ["segqu*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
